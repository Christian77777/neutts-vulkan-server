services:
  neutts-vulkan:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neutts-vulkan-server
    restart: unless-stopped
    ports:
      - "8090:8090"
      # Native Wyoming protocol port for Home Assistant (uncomment to expose)
      # WARNING: Wyoming protocol is UNAUTHENTICATED. Keep restricted to your internal LAN/Docker network.
      # - "10200:10200"
    volumes:
      - ~/.cache/huggingface:/cache/huggingface
      - ~/.cache/whisper:/cache/whisper
      - ./voices:/app/voices
      # Optional: Mount SSL certificates directory (read-only)
      # - ./certs:/app/certs:ro
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HOME=/cache/huggingface
      - DEFAULT_VOICE=aelita
      # Home Assistant Wyoming Protocol Toggle:
      # Set to 'true' to enable the Wyoming server (default: false).
      # SECURITY WARNING: Wyoming protocol does NOT support authentication or API keys.
      # Any client reaching port 10200 can synthesize audio and request transcription. Do NOT expose to public internet.
      # - ENABLE_WYOMING=true
      # - WYOMING_PORT=10200
      # - WYOMING_HOST=0.0.0.0
      # Whisper Speech-to-Text Settings:
      - ENABLE_WHISPER=true
      - WHISPER_MODEL=large-v3-turbo
      - WHISPER_LANG=en
      - WHISPER_MODELS_DIR=/cache/whisper
      - WHISPER_THREADS=4
      # Optional: set API_KEY to require Bearer authentication on all /v1/* endpoints
      # - API_KEY=your-secret-key
      # Optional: configure CORS allowed origins (unset by default; set * or list origins)
      # - CORS_ORIGINS=*
      # - CORS_ORIGINS=http://localhost:3000,http://10.12.0.21:3000
      # Optional SSL / HTTPS configuration:
      # - SSL_KEYFILE=/app/certs/key.pem
      # - SSL_CERTFILE=/app/certs/cert.pem
      # - SSL_KEYFILE_PASSWORD=secret
      # - SSL_CA_CERTS=/app/certs/ca.pem
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f -k http://localhost:8090/api/status || curl -s -f -k https://localhost:8090/api/status || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
